<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на книгу — BookNest</title>
  
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a href="#main-content">Перейти к содержимому</a>

  <header class="site-header">
    <p><a href="index.html" aria-label="BookNest — на главную">BookNest</a></p>
    <nav aria-label="Основная навигация">
      <ul class="nav-list">
        <li><a href="index.html">Каталог</a></li>
        <li><a href="book.html">О книге</a></li>
        <li><a href="loan.html" aria-current="page">Получить книгу</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="main-content container">
    <h1>Заявка на получение книги</h1>
    <p>Заполните форму, чтобы забронировать книгу.</p>

    <form action="#" method="post" class="card" style="max-width: 600px;">
      <fieldset>
        <legend>Данные читателя</legend>
        <div class="form-field">
          <label for="full-name">ФИО</label>
          <input type="text" id="full-name" name="full-name" class="form-input" required>
        </div>
        <div class="form-field">
          <label for="email">Электронная почта</label>
          <input type="email" id="email" name="email" class="form-input" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Информация о книге</legend>
        <div class="form-field">
          <label for="book-select">Выберите книгу</label>
          <select id="book-select" name="book-select" class="form-select" required>
            <option value="">-- Выберите --</option>
            <option value="pride">Гордость и предубеждение</option>
            <option value="1984">1984</option>
          </select>
        </div>
        <div class="form-field">
          <label for="loan-date">Дата получения</label>
          <input type="date" id="loan-date" name="loan-date" class="form-input" required>
        </div>
      </fieldset>

      <button type="submit" class="btn">Отправить заявку</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>BookNest — университетский книжный клуб.</p>
    <nav aria-label="Дополнительная навигация">
      <ul class="nav-list">
        <li><a href="index.html">Каталог</a></li>
        <li><a href="book.html">Карточка книги</a></li>
        <li><a href="loan.html">Форма выдачи</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
